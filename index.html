<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ZenPad - Distraction-free rich text notepad with TXT and PDF export.">
<title>ZenPad — Rich Text Notepad</title>

<!-- Client-side PDF engine -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
    --bg-color: #eef2f7;
    --bg-secondary: #ffffff;
    --text-color: #18202a;
    --muted-text: #68717d;
    --toolbar-bg: rgba(255,255,255,.72);
    --toolbar-border: rgba(0,0,0,.08);
    --btn-hover: rgba(0,0,0,.06);
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-soft: rgba(99,102,241,.12);
    --status-bg: rgba(255,255,255,.68);
    --status-text: #68717d;
    --paper: #ffffff;
    --paper-shadow: 0 24px 70px rgba(15,23,42,.13);
    --input-bg: rgba(255,255,255,.75);
    --danger: #ef4444;
    --success: #16a34a;
    --sidebar-width: 300px;
}

[data-theme="dark"] {
    --bg-color: #0b1020;
    --bg-secondary: #111827;
    --text-color: #f4f7fb;
    --muted-text: #9ca7b6;
    --toolbar-bg: rgba(17,24,39,.72);
    --toolbar-border: rgba(255,255,255,.09);
    --btn-hover: rgba(255,255,255,.08);
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --accent-soft: rgba(129,140,248,.16);
    --status-bg: rgba(17,24,39,.72);
    --status-text: #9ca7b6;
    --paper: #151c2b;
    --paper-shadow: 0 24px 80px rgba(0,0,0,.4);
    --input-bg: rgba(15,23,42,.72);
    --danger: #f87171;
    --success: #4ade80;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,.14), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(14,165,233,.12), transparent 30%),
        var(--bg-color);
    color: var(--text-color);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color .3s ease, color .3s ease;
}

button,
select,
input {
    font: inherit;
}

button,
select {
    color: var(--text-color);
}

button {
    cursor: pointer;
}

.glass {
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

/* HEADER */

header {
    min-height: 62px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 20;
    border-bottom: 1px solid var(--toolbar-border);
    background: var(--toolbar-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: max-content;
}

.brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), #22d3ee);
    color: white;
    font-size: 18px;
    box-shadow: 0 8px 24px rgba(99,102,241,.25);
}

.brand-text strong {
    display: block;
    font-size: 15px;
}

.brand-text span {
    display: block;
    color: var(--muted-text);
    font-size: 10px;
    margin-top: 1px;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
}

.toolbar::-webkit-scrollbar {
    height: 0;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 6px;
    margin-right: 3px;
    border-right: 1px solid var(--toolbar-border);
}

.toolbar-group:last-child {
    border-right: 0;
}

.tool-btn,
.toolbar select {
    min-height: 34px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 13px;
    transition: .2s ease;
}

.tool-btn:hover,
.toolbar select:hover {
    background: var(--btn-hover);
}

.tool-btn.active {
    background: var(--accent-soft);
    border-color: rgba(99,102,241,.25);
}

.toolbar select {
    border-color: var(--toolbar-border);
    outline: none;
    background-color: var(--input-bg);
}

.icon-btn {
    width: 34px;
    padding: 6px;
}

/* MAIN */

.main-layout {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
}

.editor-container {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 38px 25px 70px;
    display: flex;
    justify-content: center;
    scroll-behavior: smooth;
}

.editor-container::-webkit-scrollbar {
    width: 9px;
}

.editor-container::-webkit-scrollbar-thumb {
    background: rgba(127,127,127,.25);
    border-radius: 20px;
}

#editor {
    width: 100%;
    max-width: 850px;
    min-height: 1050px;
    height: max-content;
    outline: none;
    background: var(--paper);
    color: var(--text-color);
    padding: 70px 78px;
    border-radius: 6px;
    box-shadow: var(--paper-shadow);
    font-size: 18px;
    line-height: 1.7;
    word-wrap: break-word;
    overflow-wrap: break-word;
    transition: background-color .3s ease, color .3s ease, box-shadow .3s ease;
}

#editor:empty::before {
    content: attr(placeholder);
    color: var(--muted-text);
    opacity: .65;
    pointer-events: none;
}

#editor h1,
#editor h2,
#editor h3 {
    margin: 1em 0 .5em;
    line-height: 1.25;
}

#editor h1 {
    font-size: 2em;
}

#editor h2 {
    font-size: 1.55em;
}

#editor h3 {
    font-size: 1.25em;
}

#editor p {
    margin: .45em 0;
}

#editor ul,
#editor ol {
    margin: .5em 0 .5em 1.5em;
}

#editor blockquote {
    border-left: 4px solid var(--accent);
    margin: 1em 0;
    padding: .5em 1em;
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
}

/* SIDEBAR */

.sidebar {
    width: var(--sidebar-width);
    flex: 0 0 var(--sidebar-width);
    overflow-y: auto;
    padding: 14px;
    border-left: 1px solid var(--toolbar-border);
    background: var(--toolbar-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition:
        width .28s ease,
        flex-basis .28s ease,
        padding .28s ease,
        opacity .2s ease;
}

.sidebar.collapsed {
    width: 0;
    flex-basis: 0;
    padding: 0;
    overflow: hidden;
    border-left: 0;
}

.sidebar-section {
    margin-bottom: 16px;
}

.sidebar-title {
    color: var(--muted-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.panel {
    border: 1px solid var(--toolbar-border);
    background: rgba(255,255,255,.05);
    border-radius: 14px;
    padding: 12px;
}

[data-theme="dark"] .panel {
    background: rgba(255,255,255,.025);
}

.field {
    margin-bottom: 10px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;
    color: var(--muted-text);
    font-size: 11px;
    margin-bottom: 5px;
}

.field input,
.field select {
    width: 100%;
    border: 1px solid var(--toolbar-border);
    background: var(--input-bg);
    color: var(--text-color);
    border-radius: 9px;
    padding: 9px 10px;
    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: var(--accent);
}

.primary-btn {
    width: 100%;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: white;
    padding: 10px 12px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: 5px;
    box-shadow: 0 8px 20px rgba(99,102,241,.2);
}

.primary-btn:hover {
    transform: translateY(-1px);
}

.secondary-btn {
    width: 100%;
    border: 1px solid var(--toolbar-border);
    background: transparent;
    color: var(--text-color);
    padding: 9px 12px;
    border-radius: 10px;
    margin-top: 7px;
}

.secondary-btn:hover {
    background: var(--btn-hover);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
}

.stat-card {
    padding: 10px;
    border: 1px solid var(--toolbar-border);
    border-radius: 10px;
    background: rgba(127,127,127,.04);
}

.stat-card span {
    display: block;
    color: var(--muted-text);
    font-size: 10px;
}

.stat-card strong {
    display: block;
    margin-top: 3px;
    font-size: 16px;
}

/* AI */

.ai-output {
    color: var(--muted-text);
    font-size: 12px;
    line-height: 1.5;
    margin-top: 9px;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
}

/* FOOTER */

footer {
    min-height: 32px;
    padding: 5px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--status-text);
    font-size: 11px;
    border-top: 1px solid var(--toolbar-border);
    background: var(--status-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 20;
}

.status-left,
.status-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.save-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
}

.save-dot.saving {
    background: #f59e0b;
}

/* MOBILE */

@media (max-width: 900px) {
    header {
        flex-wrap: wrap;
    }

    .toolbar {
        order: 3;
        width: 100%;
    }

    .sidebar {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 15;
        box-shadow: -15px 0 50px rgba(0,0,0,.15);
    }

    .sidebar.collapsed {
        width: 0;
    }

    #editor {
        padding: 45px 30px;
        min-height: 900px;
    }
}

@media (max-width: 600px) {
    .brand-text {
        display: none;
    }

    .editor-container {
        padding: 18px 10px 40px;
    }

    #editor {
        padding: 35px 20px;
        border-radius: 4px;
        font-size: 16px;
    }

    .status-right {
        display: none;
    }
}

/* PRINT */

@media print {
    body {
        background: white !important;
        color: black !important;
        overflow: visible;
    }

    header,
    footer,
    .sidebar {
        display: none !important;
    }

    .main-layout,
    .editor-container {
        display: block;
        overflow: visible;
        padding: 0;
    }

    #editor {
        max-width: none;
        min-height: 0;
        padding: 0;
        box-shadow: none;
        background: white !important;
        color: black !important;
    }
}
</style>

</head>

<body>

<header>
    <div class="brand">
        <div class="brand-icon">✎</div>
        <div class="brand-text">
            <strong>ZenPad</strong>
            <span>Rich Text Notepad</span>
        </div>
    </div>


<div class="toolbar">

    <div class="toolbar-group">
        <select id="fontFamily" title="Font Family">
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Courier New">Courier</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet MS">Trebuchet</option>
        </select>

        <select id="fontSize" title="Font Size">
            <option value="3">Normal</option>
            <option value="4">Medium</option>
            <option value="5">Large</option>
            <option value="6">Extra Large</option>
            <option value="7">Huge</option>
        </select>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn icon-btn" onclick="executeCmd('bold')" title="Bold">
            <b>B</b>
        </button>

        <button class="tool-btn icon-btn" onclick="executeCmd('italic')" title="Italic">
            <i>I</i>
        </button>

        <button class="tool-btn icon-btn" onclick="executeCmd('underline')" title="Underline">
            <u>U</u>
        </button>

        <button class="tool-btn icon-btn" onclick="executeCmd('strikeThrough')" title="Strike">
            <s>S</s>
        </button>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn icon-btn" onclick="executeCmd('insertUnorderedList')" title="Bullet List">
            •
        </button>

        <button class="tool-btn icon-btn" onclick="executeCmd('insertOrderedList')" title="Numbered List">
            1.
        </button>

        <button class="tool-btn" onclick="executeCmd('formatBlock','h1')" title="Heading">
            H1
        </button>

        <button class="tool-btn" onclick="executeCmd('formatBlock','blockquote')" title="Quote">
            ❝
        </button>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn" onclick="executeCmd('justifyLeft')" title="Align Left">
            ⬅
        </button>

        <button class="tool-btn" onclick="executeCmd('justifyCenter')" title="Align Center">
            ↔
        </button>

        <button class="tool-btn" onclick="executeCmd('justifyRight')" title="Align Right">
            ➡
        </button>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn icon-btn" onclick="executeCmd('undo')" title="Undo">
            ↶
        </button>

        <button class="tool-btn icon-btn" onclick="executeCmd('redo')" title="Redo">
            ↷
        </button>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn" onclick="downloadTxt()" title="Download TXT">
            💾 TXT
        </button>

        <button class="tool-btn" onclick="openPdfPanel()" title="Export PDF">
            📄 PDF
        </button>

        <button class="tool-btn icon-btn" onclick="window.print()" title="Print">
            🖨
        </button>

        <button
            class="tool-btn icon-btn"
            id="themeToggle"
            onclick="toggleTheme()"
            title="Toggle Theme">
            🌙
        </button>

        <button
            class="tool-btn icon-btn"
            onclick="toggleSidebar()"
            title="Utilities">
            ☰
        </button>
    </div>

</div>


</header>

<div class="main-layout">


<div class="editor-container">
    <div
        id="editor"
        contenteditable="true"
        spellcheck="true"
        placeholder="Start typing your thoughts here...">
    </div>
</div>

<aside id="sidebar" class="sidebar">

    <div class="sidebar-section">
        <div class="sidebar-title">Writing Statistics</div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Words</span>
                <strong id="wordCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Characters</span>
                <strong id="charCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Reading Time</span>
                <strong id="readTime">0 min</strong>
            </div>

            <div class="stat-card">
                <span>Lines</span>
                <strong id="lineCount">0</strong>
            </div>
        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">Text to PDF</div>

        <div class="panel">

            <div class="field">
                <label for="pdfFilename">PDF filename</label>
                <input
                    id="pdfFilename"
                    type="text"
                    value="zenpad-document">
            </div>

            <div class="field">
                <label for="pdfPageSize">Page size</label>
                <select id="pdfPageSize">
                    <option value="a4">A4</option>
                    <option value="letter">Letter</option>
                    <option value="a5">A5</option>
                </select>
            </div>

            <div class="field">
                <label for="pdfMargin">Margins</label>
                <select id="pdfMargin">
                    <option value="10">Small</option>
                    <option value="15" selected>Normal</option>
                    <option value="25">Large</option>
                </select>
            </div>

            <button class="primary-btn" onclick="downloadTextPDF()">
                📄 Text → PDF
            </button>

            <button class="secondary-btn" onclick="downloadRichPDF()">
                ✨ Rich Text → PDF
            </button>

            <button class="secondary-btn" onclick="window.print()">
                🖨 Print / Save PDF
            </button>

        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">Auto Save</div>

        <div class="panel">

            <div class="field">
                <label for="autoSaveEnabled">Auto-save</label>
                <select id="autoSaveEnabled">
                    <option value="on">Enabled</option>
                    <option value="off">Disabled</option>
                </select>
            </div>

            <div class="field">
                <label for="autoSaveDelay">Save delay</label>
                <select id="autoSaveDelay">
                    <option value="300">Instant</option>
                    <option value="800" selected>Normal</option>
                    <option value="1500">Relaxed</option>
                </select>
            </div>

        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">AI Helper</div>

        <div class="panel">

            <button class="secondary-btn" onclick="simulateAI('improve')">
                ✨ Improve Writing
            </button>

            <button class="secondary-btn" onclick="simulateAI('summary')">
                📝 Summarize
            </button>

            <button class="secondary-btn" onclick="simulateAI('ideas')">
                💡 Generate Ideas
            </button>

            <div id="aiOutput" class="ai-output">
                Select an AI helper to analyze your current text.
            </div>

        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-title">Document</div>

        <div class="panel">
            <button class="secondary-btn" onclick="clearDocument()">
                🗑 Clear Document
            </button>

            <button class="secondary-btn" onclick="restoreDocument()">
                ↩ Restore Saved Version
            </button>
        </div>
    </div>

</aside>


</div>

<footer>


<div class="status-left">
    <span>
        <span id="saveDot" class="save-dot"></span>
        <span id="saveStatus">Autosaved to browser</span>
    </span>

    <span id="stats">
        Words: 0 | Characters: 0 | Read: 0 min
    </span>
</div>

<div class="status-right">
    <span>ZenPad</span>
    <span>Local-only</span>
</div>


</footer>

<script>
"use strict";

/* =========================================================
   CORE ELEMENTS
========================================================= */

const editor = document.getElementById("editor");
const sidebar = document.getElementById("sidebar");
const saveStatus = document.getElementById("saveStatus");
const saveDot = document.getElementById("saveDot");

let saveTimer = null;

const STORAGE_CONTENT = "zenpad_content";
const STORAGE_THEME = "zenpad_theme";
const STORAGE_AUTOSAVE = "zenpad_autosave";
const STORAGE_DELAY = "zenpad_autosave_delay";

/* =========================================================
   EDITOR COMMAND ENGINE
========================================================= */

function executeCmd(command, value = null) {
    editor.focus();

    try {
        document.execCommand(command, false, value);
    } catch (error) {
        console.warn("Formatting command failed:", error);
    }

    updateStats();
    scheduleAutoSave();
}

/* =========================================================
   FONT CONTROLS
========================================================= */

document.getElementById("fontFamily").addEventListener("change", function () {
    executeCmd("fontName", this.value);
});

document.getElementById("fontSize").addEventListener("change", function () {
    executeCmd("fontSize", this.value);
});

/* =========================================================
   AUTO SAVE
========================================================= */

editor.addEventListener("input", function () {
    updateStats();
    scheduleAutoSave();
});

function scheduleAutoSave() {

    if (getAutoSaveEnabled() === "off") {
        saveStatus.textContent = "Auto-save disabled";
        saveDot.classList.remove("saving");
        return;
    }

    clearTimeout(saveTimer);

    const delay =
        Number(localStorage.getItem(STORAGE_DELAY)) || 800;

    saveStatus.textContent = "Saving...";
    saveDot.classList.add("saving");

    saveTimer = setTimeout(saveDocument, delay);
}

function saveDocument() {

    localStorage.setItem(STORAGE_CONTENT, editor.innerHTML);

    saveStatus.textContent = "Autosaved to browser";
    saveDot.classList.remove("saving");
}

function getAutoSaveEnabled() {
    return localStorage.getItem(STORAGE_AUTOSAVE) || "on";
}

document
    .getElementById("autoSaveEnabled")
    .addEventListener("change", function () {

        localStorage.setItem(
            STORAGE_AUTOSAVE,
            this.value
        );

        if (this.value === "on") {
            scheduleAutoSave();
        } else {
            saveStatus.textContent = "Auto-save disabled";
        }
    });

document
    .getElementById("autoSaveDelay")
    .addEventListener("change", function () {

        localStorage.setItem(
            STORAGE_DELAY,
            this.value
        );

        scheduleAutoSave();
    });

/* =========================================================
   LOAD DOCUMENT
========================================================= */

window.addEventListener("DOMContentLoaded", function () {

    const savedContent =
        localStorage.getItem(STORAGE_CONTENT);

    if (savedContent !== null) {
        editor.innerHTML = savedContent;
    }

    const savedTheme =
        localStorage.getItem(STORAGE_THEME);

    if (savedTheme === "dark") {
        document.body.setAttribute(
            "data-theme",
            "dark"
        );

        document.getElementById("themeToggle").textContent = "☀️";
    }

    const autoSave =
        localStorage.getItem(STORAGE_AUTOSAVE);

    if (autoSave) {
        document.getElementById(
            "autoSaveEnabled"
        ).value = autoSave;
    }

    const delay =
        localStorage.getItem(STORAGE_DELAY);

    if (delay) {
        document.getElementById(
            "autoSaveDelay"
        ).value = delay;
    }

    updateStats();
});

/* =========================================================
   STATS ENGINE
========================================================= */

function getEditorText() {
    return editor.innerText
        .replace(/\u00a0/g, " ")
        .replace(/\r/g, "");
}

function updateStats() {

    const text = getEditorText();

    const cleanText = text.trim();

    const characters = text.length;

    const words =
        cleanText === ""
            ? 0
            : cleanText.split(/\s+/).length;

    const lines =
        cleanText === ""
            ? 0
            : cleanText.split("\n").length;

    const readingMinutes =
        words === 0
            ? 0
            : Math.max(1, Math.ceil(words / 200));

    document.getElementById(
        "wordCount"
    ).textContent = words;

    document.getElementById(
        "charCount"
    ).textContent = characters;

    document.getElementById(
        "readTime"
    ).textContent = readingMinutes + " min";

    document.getElementById(
        "lineCount"
    ).textContent = lines;

    document.getElementById(
        "stats"
    ).textContent =
        `Words: ${words} | Characters: ${characters} | Read: ${readingMinutes} min`;
}

/* =========================================================
   THEME ENGINE
========================================================= */

function toggleTheme() {

    const isDark =
        document.body.hasAttribute("data-theme");

    if (isDark) {

        document.body.removeAttribute(
            "data-theme"
        );

        document.getElementById(
            "themeToggle"
        ).textContent = "🌙";

        localStorage.setItem(
            STORAGE_THEME,
            "light"
        );

    } else {

        document.body.setAttribute(
            "data-theme",
            "dark"
        );

        document.getElementById(
            "themeToggle"
        ).textContent = "☀️";

        localStorage.setItem(
            STORAGE_THEME,
            "dark"
        );
    }
}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {
    sidebar.classList.toggle("collapsed");
}

/* =========================================================
   TXT EXPORT
========================================================= */

function downloadTxt() {

    const text = getEditorText();

    const blob = new Blob(
        [text],
        { type: "text/plain;charset=utf-8" }
    );

    const url =
        URL.createObjectURL(blob);

    const anchor =
        document.createElement("a");

    anchor.href = url;

    anchor.download =
        getSafeFilename("zenpad-document") + ".txt";

    document.body.appendChild(anchor);

    anchor.click();

    anchor.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );
}

/* =========================================================
   PDF PANEL
========================================================= */

function openPdfPanel() {

    if (sidebar.classList.contains("collapsed")) {
        sidebar.classList.remove("collapsed");
    }

    document
        .getElementById("pdfFilename")
        .focus();
}

/* =========================================================
   SAFE FILENAME
========================================================= */

function getSafeFilename(defaultName) {

    const input =
        document.getElementById("pdfFilename");

    let filename =
        input.value.trim() || defaultName;

    filename =
        filename
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, "-")
            .replace(/\s+/g, " ")
            .trim();

    return filename || defaultName;
}

/* =========================================================
   TEXT → PDF ENGINE
   Creates a clean PDF from plain editor text.
========================================================= */

async function downloadTextPDF() {

    if (typeof html2pdf === "undefined") {
        alert(
            "The PDF engine could not be loaded. Check your internet connection and try again."
        );
        return;
    }

    const text =
        getEditorText().trim();

    if (!text) {
        alert(
            "Please enter some text before creating a PDF."
        );
        editor.focus();
        return;
    }

    const filename =
        getSafeFilename("zenpad-document");

    const pageSize =
        document.getElementById(
            "pdfPageSize"
        ).value;

    const margin =
        Number(
            document.getElementById(
                "pdfMargin"
            ).value
        );

    const pdfContent =
        document.createElement("div");

    pdfContent.style.background = "#ffffff";
    pdfContent.style.color = "#111111";
    pdfContent.style.width = "100%";
    pdfContent.style.padding = "0";
    pdfContent.style.fontFamily =
        "Arial, Helvetica, sans-serif";
    pdfContent.style.fontSize = "14px";
    pdfContent.style.lineHeight = "1.7";
    pdfContent.style.whiteSpace = "pre-wrap";
    pdfContent.style.wordBreak = "break-word";

    /*
       Using textContent rather than innerHTML here is
       intentional. It creates a genuine plain-text PDF
       and prevents document markup from becoming HTML.
    */
    pdfContent.textContent = text;

    document.body.appendChild(pdfContent);

    const options = {
        margin: margin,
        filename: filename + ".pdf",

        image: {
            type: "jpeg",
            quality: 0.98
        },

        html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        },

        jsPDF: {
            unit: "mm",
            format: pageSize,
            orientation: "portrait"
        },

        pagebreak: {
            mode: [
                "css",
                "legacy"
            ]
        }
    };

    try {

        saveStatus.textContent =
            "Generating PDF...";

        saveDot.classList.add("saving");

        await html2pdf()
            .set(options)
            .from(pdfContent)
            .save();

        saveStatus.textContent =
            "PDF downloaded";

    } catch (error) {

        console.error(
            "Text PDF generation error:",
            error
        );

        alert(
            "PDF generation failed. Please try again."
        );

    } finally {

        pdfContent.remove();

        saveDot.classList.remove("saving");

        setTimeout(() => {
            saveStatus.textContent =
                "Autosaved to browser";
        }, 2000);
    }
}

/* =========================================================
   RICH TEXT → PDF ENGINE
========================================================= */

async function downloadRichPDF() {

    if (typeof html2pdf === "undefined") {
        alert(
            "The PDF engine could not be loaded. Check your internet connection and try again."
        );
        return;
    }

    if (!editor.innerText.trim()) {
        alert(
            "Please enter some content before creating a PDF."
        );
        editor.focus();
        return;
    }

    const filename =
        getSafeFilename("zenpad-document");

    const pageSize =
        document.getElementById(
            "pdfPageSize"
        ).value;

    const margin =
        Number(
            document.getElementById(
                "pdfMargin"
            ).value
        );

    const pdfWrapper =
        document.createElement("div");

    pdfWrapper.style.background = "#ffffff";
    pdfWrapper.style.color = "#111111";
    pdfWrapper.style.width = "100%";
    pdfWrapper.style.padding = "0";
    pdfWrapper.style.fontFamily =
        "Arial, Helvetica, sans-serif";
    pdfWrapper.style.fontSize = "14px";
    pdfWrapper.style.lineHeight = "1.65";
    pdfWrapper.style.wordBreak = "break-word";

    /*
       Clone the editor so the actual editor is never
       modified during PDF generation.
    */
    const clone =
        editor.cloneNode(true);

    clone.removeAttribute("contenteditable");
    clone.removeAttribute("id");

    clone.style.background = "#ffffff";
    clone.style.color = "#111111";
    clone.style.boxShadow = "none";
    clone.style.padding = "0";
    clone.style.margin = "0";
    clone.style.width = "100%";
    clone.style.maxWidth = "none";
    clone.style.minHeight = "0";

    pdfWrapper.appendChild(clone);

    document.body.appendChild(pdfWrapper);

    const options = {

        margin: margin,

        filename:
            filename + ".pdf",

        image: {
            type: "jpeg",
            quality: 0.98
        },

        html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        },

        jsPDF: {
            unit: "mm",
            format: pageSize,
            orientation: "portrait"
        },

        pagebreak: {
            mode: [
                "css",
                "legacy"
            ]
        }
    };

    try {

        saveStatus.textContent =
            "Generating rich PDF...";

        saveDot.classList.add("saving");

        await html2pdf()
            .set(options)
            .from(pdfWrapper)
            .save();

        saveStatus.textContent =
            "Rich PDF downloaded";

    } catch (error) {

        console.error(
            "Rich PDF generation error:",
            error
        );

        alert(
            "Rich PDF generation failed. Please try again."
        );

    } finally {

        pdfWrapper.remove();

        saveDot.classList.remove("saving");

        setTimeout(() => {
            saveStatus.textContent =
                "Autosaved to browser";
        }, 2000);
    }
}

/* =========================================================
   AI HELPER
   Client-side simulated helper — no API/backend.
========================================================= */

function simulateAI(type) {

    const text =
        getEditorText().trim();

    const output =
        document.getElementById("aiOutput");

    if (!text) {
        output.textContent =
            "Write something in the editor first.";
        return;
    }

    output.textContent =
        "Analyzing your writing...";

    setTimeout(() => {

        if (type === "improve") {

            output.textContent =
                "Suggestion:\n\n" +
                "Your writing has been detected. " +
                "For a clearer result, consider shorter paragraphs, " +
                "stronger topic sentences, and removing repeated ideas.\n\n" +
                "This is a local simulated helper; no text is sent to a server.";

        } else if (type === "summary") {

            const words =
                text.split(/\s+/);

            const preview =
                words
                    .slice(0, 35)
                    .join(" ");

            output.textContent =
                "Local summary preview:\n\n" +
                preview +
                (words.length > 35 ? "..." : "") +
                "\n\n" +
                "This helper runs entirely inside your browser.";

        } else if (type === "ideas") {

            output.textContent =
                "Idea prompts:\n\n" +
                "• What is the main problem?\n" +
                "• What evidence supports the idea?\n" +
                "• What would happen if the opposite were true?\n" +
                "• Can this idea be explained with an example?\n" +
                "• What should the reader remember?";

        }

    }, 500);
}

/* =========================================================
   CLEAR DOCUMENT
========================================================= */

function clearDocument() {

    const confirmed =
        confirm(
            "Clear the current document?\n\nYour saved browser copy will also be replaced."
        );

    if (!confirmed) {
        return;
    }

    editor.innerHTML = "";

    localStorage.removeItem(
        STORAGE_CONTENT
    );

    updateStats();

    saveDocument();

    editor.focus();
}

/* =========================================================
   RESTORE SAVED DOCUMENT
========================================================= */

function restoreDocument() {

    const saved =
        localStorage.getItem(
            STORAGE_CONTENT
        );

    if (saved === null) {

        alert(
            "No saved document was found."
        );

        return;
    }

    editor.innerHTML = saved;

    updateStats();

    saveStatus.textContent =
        "Saved version restored";

    editor.focus();
}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (!(event.ctrlKey || event.metaKey)) {
            return;
        }

        const key =
            event.key.toLowerCase();

        if (key === "s") {

            event.preventDefault();

            saveDocument();

        } else if (key === "p") {

            event.preventDefault();

            window.print();

        } else if (key === "b") {

            event.preventDefault();

            executeCmd("bold");

        } else if (key === "i") {

            event.preventDefault();

            executeCmd("italic");

        } else if (key === "u") {

            event.preventDefault();

            executeCmd("underline");
        }
    }
);

/* =========================================================
   BEFORE PAGE EXIT
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        if (getAutoSaveEnabled() === "on") {
            saveDocument();
        }
    }
);

/* =========================================================
   INITIAL STATS
========================================================= */

updateStats();
</script>
